<text x="40.0" y="640.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">T1 and T4 committed before W, so the bulk scan already has them. T5 started after W, so all three watermarks replay it.</text>
<text x="40.0" y="662.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">T2 and T3 stamped their rows before W and committed after it. The scan's snapshot predates both commits, and updated_at &lt; W excludes them from the replay.</text>
<text x="40.0" y="684.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#898781" font-weight="400" text-anchor="start">T4 allocated seq 52 and committed first, so MAX(seq) = 52 also excludes seq 50 and 51 - it only works when nothing allocated later commits ahead of you.</text>
</svg>