<text x="40.0" y="52.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" fill="#0b0b0b" font-weight="600" text-anchor="start">Three watermarks on a commit timeline</text>
<text x="40.0" y="80.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" fill="#52514e" font-weight="400" text-anchor="start">Each watermark is read at the same instant. Only the snapshot xmin covers transactions that were still open.</text>
