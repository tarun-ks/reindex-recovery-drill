<rect x="740" y="477" width="12" height="12" rx="2" fill="#eb6834"/>
<text x="760.0" y="488.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start">barrier</text>
<rect x="40" y="503" width="12" height="12" rx="2" fill="#1baf7a"/>
<text x="60.0" y="514.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start">drain</text>
<rect x="390" y="503" width="12" height="12" rx="2" fill="#eda100"/>
