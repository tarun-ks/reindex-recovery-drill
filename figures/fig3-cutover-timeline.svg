<rect x="740" y="503" width="12" height="12" rx="2" fill="#e87ba4"/>
<text x="760.0" y="514.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start">verify</text>
<text x="40.0" y="562.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start">Holding refresh at 1s, the replica costs 30% of indexing throughput (37,070 -&gt; 25,900 docs/sec) - but that work overlaps the scan instead of</text>
<text x="40.0" y="584.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start">deferring to shard settlement, so time-to-verified is 25.7s vs 24.1s. At refresh -1 it is 27.0s vs 25.8s, a 4.5% difference. Disabling refresh was slower on both axes.</text>
<text x="40.0" y="612.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" fill="#898781" font-weight="400" text-anchor="start">The dashed line marks where writes stop. The synthetic writer had finished its plan by then, so this is finalization duration, not measured latency for blocked writes.</text>
</svg>